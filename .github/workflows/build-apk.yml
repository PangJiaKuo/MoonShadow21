name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 + compileSdk 36 需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 用绝对路径定位 sdkmanager（不依赖 PATH），安装 android-36；已存在则幂等跳过
      - name: Install Android SDK 36
        run: |
          SM=$(find /usr/local/lib/android/sdk -name sdkmanager 2>/dev/null | grep cmdline-tools | head -1)
          echo "SDKMANAGER=$SM"
          test -n "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          yes | "$SM" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies (monorepo)
        run: npm ci

      - name: Build web assets
        run: npm run build --workspace @moon21/client

      - name: Sync Capacitor to Android
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon21-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
