name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 + compileSdk 36 需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 用 runner 自带的 sdkmanager 安装 android-36 平台与 build-tools（比第三方 action 稳定）
      - name: Install Android SDK 36
        run: |
          yes | sudo sdkmanager --licenses > /dev/null || true
          sudo sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies (monorepo)
        run: npm ci

      - name: Build web assets
        run: npm run build --workspace @moon21/client

      - name: Sync Capacitor to Android
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon21-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
